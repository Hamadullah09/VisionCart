<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VisionCart Optical">
  <!-- A filled tile rather than a bare glyph: a tab strip is a crowded place,
       and a dark block with a light mark inside it is legible at 16px where a
       thin outline dissolves. -->
  <rect width="64" height="64" rx="14" fill="#1C1917"/>
  <g fill="none" stroke="#FAF8F5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="19" cy="36" r="10"/>
    <circle cx="45" cy="36" r="10"/>
    <path d="M29 34.5c1.8-2 4.2-2 6 0"/>
    <path d="M9.5 31.5 4.5 23.5"/>
    <path d="M54.5 31.5 59.5 23.5"/>
  </g>
</svg>
